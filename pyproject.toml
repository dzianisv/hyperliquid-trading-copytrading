[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-copytrader"
version = "2.0.0"
description = "Professional copy trading application for HyperLiquid DEX"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "HyperLiquid Copy Trader Team"}
]
maintainers = [
    {name = "HyperLiquid Copy Trader Team"}
]
keywords = [
    "trading",
    "cryptocurrency",
    "hyperliquid",
    "copy-trading",
    "defi",
    "automated-trading"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.8"
dependencies = [
    "PyInstaller>=6.11.0",
    "paramiko>=3.5.0",
    "python-dotenv>=1.0.0",
    "eth-account>=0.10.0",
    "hyperliquid-python-sdk>=0.9.0",
    "requests>=2.31.0",
    "cryptography>=41.0.7",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
build = [
    "PyInstaller>=6.11.0",
    "setuptools>=45",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/lucyCooked/hyperliquid-copytrader"
Repository = "https://github.com/lucyCooked/hyperliquid-copytrader.git"
Documentation = "https://github.com/lucyCooked/hyperliquid-copytrader#readme"
"Bug Tracker" = "https://github.com/lucyCooked/hyperliquid-copytrader/issues"

[project.scripts]
hyperliquid-copytrader = "src.gui.trading_app:main"

[tool.setuptools]
packages = ["src", "src.bots", "src.gui", "src.utils"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.cfg", "*.ini"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
